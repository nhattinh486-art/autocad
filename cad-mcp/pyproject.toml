[project]
name = "cad-mcp"
version = "2.0.0"
description = "Máy chủ CAD MCP - Điều khiển AutoCAD/GstarCAD/ZWCAD qua MCP để vẽ, truy vấn, chỉnh sửa và quản lý bản vẽ"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "mcp>=1.12,<2",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[project.scripts]
# Sau khi cài đặt có thể chạy trực tiếp lệnh cad-mcp để khởi động máy chủ
cad-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Giữ nguyên cấu trúc thư mục src để tương thích cách chạy cũ python src/server.py
packages = ["src"]
